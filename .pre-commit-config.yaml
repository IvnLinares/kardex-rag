repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: frontend-lint
        name: eslint (frontend)
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/src/
        pass_filenames: false
      - id: frontend-format
        name: prettier --check (frontend)
        entry: npm --prefix frontend run format:check
        language: system
        files: ^frontend/src/
        pass_filenames: false
