# Proyecto: Módulo AI - Copiloto Analítico para Sistema de Inventarios y Kardex (Smart RAG)
# Stack completo: DB (pgvector) + LLM local (Ollama) + backend (FastAPI) + frontend (Vue).

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: kardex_rag_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kardex_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-kardex_rag}
    ports:
      - "5433:5432"
    volumes:
      - kardex_pgdata:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kardex_admin}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama
    container_name: kardex_rag_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - kardex_ollama:/root/.ollama

  backend:
    build: ./backend
    container_name: kardex_rag_backend
    env_file: .env
    environment:
      # Dentro de la red de docker compose, los otros servicios se resuelven
      # por nombre, no por localhost/el puerto publicado en el host.
      DATABASE_URL: postgresql://${POSTGRES_USER:-kardex_admin}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-kardex_rag}
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: kardex_rag_frontend
    env_file: .env
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  kardex_pgdata:
  kardex_ollama:
